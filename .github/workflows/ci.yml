name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  # Callable, so release.yml can require every job below before a tag exists.
  workflow_call:
  # Re-runnable from the Actions tab without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
        symfony: [ '6.4.*', '7.*', '8.*' ]
        exclude:
          # Symfony 7 requires PHP 8.2+, Symfony 8 requires PHP 8.4+
          - php: '8.1'
            symfony: '7.*'
          - php: '8.1'
            symfony: '8.*'
          - php: '8.2'
            symfony: '8.*'
          - php: '8.3'
            symfony: '8.*'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Pin Symfony version
        run: |
          composer require --no-update \
            symfony/config:${{ matrix.symfony }} \
            symfony/dependency-injection:${{ matrix.symfony }} \
            symfony/http-kernel:${{ matrix.symfony }}
          composer require --no-update --dev \
            symfony/console:${{ matrix.symfony }} \
            symfony/event-dispatcher:${{ matrix.symfony }} \
            symfony/messenger:${{ matrix.symfony }} \
            symfony/security-core:${{ matrix.symfony }}

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit

  lowest-dependencies:
    name: Tests (lowest supported dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install the oldest versions composer.json allows
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit

      # This job is the one that pays: an annotation that narrows, or an SDK method the
      # oldest supported version does not have, is invisible everywhere else.
      - name: Run PHPStan against the oldest dependencies
        run: vendor/bin/phpstan analyse --no-progress

  integration:
    name: Integration (Elasticsearch ${{ matrix.elasticsearch }}, client ${{ matrix.client }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elasticsearch: '8.19.0'
            client: '^8.0'
          - elasticsearch: '9.1.0'
            client: '^9.0'
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.elasticsearch }}
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Pin Elasticsearch client
        run: composer require --no-update elasticsearch/elasticsearch:"${{ matrix.client }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Run integration tests
        env:
          AUDIT_ES_URL: http://localhost:9200
        run: vendor/bin/phpunit --group integration

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run tests with coverage
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Enforce the coverage floor
        run: php tools/coverage-floor.php coverage.xml 94

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Validate composer.json
        run: composer validate --strict

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress
